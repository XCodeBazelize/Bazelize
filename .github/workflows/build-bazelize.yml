name: Build Bazelize

on:
  workflow_call:

permissions:
  contents: read

jobs:
  artifact:
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: SPM Cache
        uses: ./.github/actions/swift-cache
        with:
          group: root-universal-release
          path: .build
          dependencies: ${{ hashFiles('Package.resolved') }}

      - name: Build Bazelize
        id: build
        run: |
          swift build -c release --arch arm64 --arch x86_64
          binary="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/bazelize"
          test -x "$binary"
          case "$(lipo -archs "$binary")" in
            "arm64 x86_64"|"x86_64 arm64") ;;
            *) echo "Expected arm64 and x86_64 CLI slices" >&2; exit 1 ;;
          esac
          echo "binary=$binary" >> "$GITHUB_OUTPUT"

      - name: Upload Bazelize
        uses: actions/upload-artifact@v7
        with:
          name: bazelize
          path: ${{ steps.build.outputs.binary }}
          if-no-files-found: error
