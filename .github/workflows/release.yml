name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_SHA: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Tag CI starts alongside this workflow. Wait here before using macOS.
      - name: Wait for successful tag validation
        id: gate
        run: |
          python3 -u .github/scripts/release.py gate \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY"

  release:
    needs: [validate]
    if: needs.validate.outputs.run_id != ''
    runs-on: macos-26
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the validated universal binary
        uses: actions/download-artifact@v8
        with:
          name: bazelize
          path: validated
          run-id: ${{ needs.validate.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify version and prepare assets and notes
        run: |
          chmod +x validated/bazelize
          python3 .github/scripts/release.py package \
            --tag "$RELEASE_TAG" --binary validated/bazelize --output dist
          python3 .github/scripts/release.py notes \
            --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" \
            --repository "$GITHUB_REPOSITORY" --output dist/notes.md

      - name: Verify downloadable assets before publishing
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [ "$existing" = false ]; then
              echo "Release already published"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" \
              dist/bazelize-macos-universal.tar.gz dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --notes-file dist/notes.md
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --target "$RELEASE_SHA" --title "$RELEASE_TAG" \
              --notes-file dist/notes.md \
              dist/bazelize-macos-universal.tar.gz dist/SHA256SUMS
          fi
          gh release download "$RELEASE_TAG" --dir downloaded \
            --pattern bazelize-macos-universal.tar.gz --pattern SHA256SUMS
          (
            cd downloaded
            shasum -a 256 -c SHA256SUMS
            tar -xzf bazelize-macos-universal.tar.gz
            test "$(./bazelize --version)" = "${RELEASE_TAG#v}"
          )
          gh release edit "$RELEASE_TAG" --draft=false --latest
