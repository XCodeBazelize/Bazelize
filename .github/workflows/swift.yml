name: Swift

on: 
  push:
    branches: 
      - master
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'spm/**'
      - '.github/workflows/**'
      - 'Package.swift'
      - 'fixture/iOS/**'
      - 'mise.toml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'spm/**'
      - '.github/workflows/**'
      - 'Package.swift'
      - 'fixture/iOS/**'
      - 'mise.toml'

concurrency: 
  group: ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6

    - uses: jdx/mise-action@v4

    - name: Generate iOS fixture
      run: tuist generate --path fixture/iOS --no-open

    - name: Check Xcode Version
      run: |
        xcodebuild -version
        swift --version
        swift package --version

    - name: Get swift version
      run: swift --version # Swift 5.3.3

    - name: SPM Cache
      uses: actions/cache@v5
      with:
        path: .build
        key: ${{ runner.os }}-macos-26-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-macos-26-spm-

    - name: Build
      run: make build

    - name: Run tests
      run: make test

  artifact:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: SPM Cache
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Bazelize
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Upload Bazelize
        uses: actions/upload-artifact@v7
        with:
          name: bazelize
          path: .build/apple/Products/Release/bazelize
          if-no-files-found: ignore # 'warn' or 'ignore' 

  IntegrateIOS:
    runs-on: macos-26
    needs: [artifact]
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4

      - name: Generate Xcode project
        run: tuist generate --path fixture/iOS --no-open

      # Every `bazel` in this job reads these: the disk cache holds what the
      # build produced, the repository cache what it downloaded. Without the
      # second one a runner fetches rules_apple and the rest again every time.
      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-IntegrateIOS-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-IntegrateIOS-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc
          # A release download that answers 500 is GitHub having a moment, not
          # a broken build: it is retried rather than failing a lane.
          echo "common --experimental_repository_downloader_retries=10" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Check
        run: |
          ls -l
          pwd
          chmod +x bazelize

      # A plugin that did not run leaves the target missing the sources it
      # generates, and the compile error that follows names those sources rather
      # than the plugin. The run says so; the lane stops there.
      - name: Bazel Generation
        working-directory: fixture/iOS
        run: |
          ../../bazelize --input Example.xcodeproj --output App | tee bazelize.log
          ! grep -q "did not run the" bazelize.log

      # What buildifier says about the generated Starlark, reported rather than
      # gated: formatting is `bazel run //:format`'s business, and a warning is
      # read here instead of stopping a lane that otherwise builds and runs.
      - name: Check Generated Starlark
        continue-on-error: true
        working-directory: fixture/iOS/App
        run: bazel run //:lint

      - name: Build Products
        working-directory: fixture/iOS/App
        run: bazel build //Targets/Example //Targets/MacBundle

      - name: Copy IPA
        working-directory: fixture/iOS/App
        run: |
          cp "$(bazel cquery //Targets/Example --output=files | grep '\.ipa$')" ../Example.ipa

      # A simulator test on a runner pays for booting the simulator, and four of
      # them booting at once pay for it four times over: the first test took
      # 247s here and the last timed out at 302s having never started. One
      # simulator is booted up front, outside any test's clock, and the tests
      # run one at a time so they share it.
      #
      # Which simulator is the runner's business, not ours: it has whatever
      # runtime its Xcode ships, which is not the one this repository is
      # developed against.
      - name: Boot Simulator
        run: |
          # A device name has spaces in it, so one field per line.
          { read -r device; read -r version; read -r udid; } < <(python3 - <<'PY'
          import json, subprocess

          def simctl(*arguments):
              listed = subprocess.run(["xcrun", "simctl", "list", "-j", *arguments], capture_output=True, text=True)
              return json.loads(listed.stdout)

          runtimes = [runtime for runtime in simctl("runtimes")["runtimes"]
                      if runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")
                      and runtime.get("isAvailable")]
          runtimes.sort(key=lambda runtime: [int(part) for part in runtime["version"].split(".")])
          runtime = runtimes[-1]

          devices = [device for device in simctl("devices", "available")["devices"].get(runtime["identifier"], [])
                     if device["name"].startswith("iPhone")]
          if devices:
              name, udid = devices[-1]["name"], devices[-1]["udid"]
          else:
              kinds = [kind for kind in simctl("devicetypes")["devicetypes"] if kind["name"].startswith("iPhone")]
              name = kinds[-1]["name"]
              created = subprocess.run(
                  ["xcrun", "simctl", "create", name, kinds[-1]["identifier"], runtime["identifier"]],
                  capture_output=True, text=True)
              udid = created.stdout.strip()

          print(name)
          print(runtime["version"])
          print(udid)
          PY
          )
          echo "Simulator: $device, iOS $version ($udid)"
          echo "SIMULATOR_DEVICE=$device" >> "${GITHUB_ENV:-/dev/null}"
          echo "SIMULATOR_VERSION=$version" >> "${GITHUB_ENV:-/dev/null}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid"

      - name: Unit Test
        working-directory: fixture/iOS/App
        run: |
          bazel test \
            --@build_bazel_rules_apple//apple/build_settings:ios_simulator_device="$SIMULATOR_DEVICE" \
            --@build_bazel_rules_apple//apple/build_settings:ios_simulator_version="$SIMULATOR_VERSION" \
            --local_test_jobs=1 \
            --test_timeout=900 \
            --test_output=errors \
            //Targets/ExampleTests \
            //Targets/Framework1Tests \
            //Targets/Framework2Tests \
            //Targets/Framework3Tests

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS_Example.ipa
          path: fixture/iOS/Example.ipa
          if-no-files-found: ignore # 'warn' or 'ignore'

  # The corpus is not in this repository: `app/` and `spm/` are ignored, so each
  # lane clones what it measures at the revision it was measured against.
  IntegrateApp:
    name: IntegrateApp (${{ matrix.name }})
    runs-on: macos-26
    needs: [artifact]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            repo: https://github.com/exelban/stats
            rev: b4251e2ba05511de6b51b296d7b9e98a9c6545f5
            project: Stats.xcodeproj
            target: //Targets/Stats
          - name: MonitorControl
            repo: https://github.com/MonitorControl/MonitorControl
            rev: 71b8c5ae51955d17b05688371ea7b899b684bdbd
            project: MonitorControl.xcodeproj
            target: //Targets/MonitorControl
          - name: SwiftBar
            repo: https://github.com/swiftbar/SwiftBar
            rev: 05cb6cb1123bc7227ee2b39f390f8bccb839fed0
            project: SwiftBar.xcodeproj
            target: //Targets/SwiftBar
          - name: Rectangle
            repo: https://github.com/rxhanson/Rectangle
            rev: b4c9c47c00b4df9cbfb3489dc5eae2f1249ad24a
            project: Rectangle.xcodeproj
            target: //...
          - name: VirtualBuddy
            repo: https://github.com/insidegui/VirtualBuddy
            rev: 088351b0fc67e0b24b83e7954ad48314dda4ce04
            project: VirtualBuddy.xcodeproj
            target: //Targets/VirtualBuddy
          # iina links dylibs that are not in its repository, and the script it
          # ships downloads whatever the feed serves today: at this revision
          # 48 of the 71 libraries it names are no longer there, so the feed is
          # pinned to the version whose file list this revision matches.
          - name: iina
            repo: https://github.com/iina/iina
            rev: c111221ea027466b79b40bfca054772d4851e06f
            project: iina.xcodeproj
            target: //Targets/iina
            setup: sed -i '' 's|dylibs/${ARCH}|dylibs/1.4.2/${ARCH}|' other/download_libs.sh && ./other/download_libs.sh --skip-plugins
          # The one iOS app of the corpus, and the one that embeds several
          # extensions in a product: a widget, a notification service, a share
          # sheet and an action. Thirteen packages of its own repository, too.
          # It needs no setup: the xcconfig its README has you copy is read by
          # Xcode, not by what bazelize generates.
          #
          # The revision is pinned behind the app's head on purpose: the runner
          # ships Xcode 26.6, and the app adopted iOS 27 API (`defaultTabBarPlacement`)
          # in the commit after this one. This is the newest revision that
          # builds against the SDK this lane has.
          - name: IceCubesApp
            repo: https://github.com/Dimillian/IceCubesApp
            rev: b2db3033fbf67a97b54d25d6dac2df8a029b26b1
            project: IceCubesApp.xcodeproj
            target: //Targets/IceCubesApp

          # Four more apps were measured locally but do not meet the lane
          # contract. Their revisions stay recorded so a retry is reproducible.
          #
          # Maccy builds locally against Xcode 27 but not on a runner: at
          # 19c3d828 it adopted SwiftUI's `.reorderable()` / `ReorderDifference`,
          # which the runner's Xcode 26.6 SDK does not have, and its
          # `SWIFT_DEFAULT_ACTOR_ISOLATION = MainActor` sources are rejected by
          # that toolchain's concurrency checking as well. Neither is the
          # generated build's doing.
          # Maccy: 19c3d8282f50316779085964b5148b76d4bb88ce
          #
          # NetNewsWire generates no application rule, Mastodon's pinned Nuke
          # fails under Xcode 27, and Swiftfin fails during SwiftPM resolution.
          # NetNewsWire: 383e46f28421f7f55934ee3869f431bfde1c6de3
          # Mastodon: c52a63091abe557724a1e588149f3172466756e5
          # Swiftfin: a088a83c4deb70d87f4077c7f9e42ecacd0fe8c7

          # Apps measured for the corpus and kept out of it, with the reason
          # each one was kept out. `xcodebuild` is the control: an app Xcode
          # cannot build at the revision measured is not a lane, and nothing
          # about the generated build is to blame. Measured against Xcode 27.0
          # (SDK 27.0) — a newer revision of any of these may well be green,
          # which is the point of writing down which one was tried.

          # Carthage dependencies whose deployment targets are 10.9 to 10.15,
          # below the 12.0 Xcode 27 accepts: `carthage bootstrap` fails on the
          # first one and `Carthage/Build` is never written, so the app links
          # nothing. No lane configuration fixes that.
          # - name: MacPass
          #   repo: https://github.com/MacPass/MacPass
          #   rev: 3256bc93ea94eb20b618c155e6a1b08e6fabe663
          #   project: MacPass.xcodeproj
          #   target: //Targets/MacPass
          #   submodules: true
          #   setup: carthage bootstrap --platform macOS --cache-builds

          # `LanguageServerRowView.swift:40: 'self' used before all stored
          # properties are initialized` — Swift 6.3 rejects what an older
          # compiler accepted. xcodebuild fails the same way.
          # - name: CodeEdit
          #   repo: https://github.com/CodeEditApp/CodeEdit
          #   rev: 05704cb7d2b19892ffcb9742b0ab3cc6116af165
          #   project: CodeEdit.xcodeproj
          #   target: //Targets/CodeEdit

          # `MACOSX_DEPLOYMENT_TARGET is set to 11.3, but the range of
          # supported deployment target versions is 12.0 to 27.0.x` for all
          # five macOS targets. Its sysroot is built by `scripts/build_dependencies.sh`
          # (QEMU, ANGLE, virglrenderer, MoltenVK from source) or downloaded
          # from a logged-in GitHub Actions run, neither of which a lane can do.
          # - name: UTM
          #   repo: https://github.com/utmapp/UTM
          #   rev: b6f7475be54f9cb542c46b131319454b83489ced
          #   project: UTM.xcodeproj
          #   target: //Targets/macOS

          # No `Package.resolved` is committed, so every dependency floats to
          # whatever is newest: resolution itself fails today on a manifest
          # using `visionOS` against an older `PackageDescription`. A pinned
          # revision would still resolve differently on every run, and its
          # Carthage bootstrap is the mechanism MacPass was removed over.
          # - name: PlayCover
          #   repo: https://github.com/PlayCover/PlayCover
          #   rev: a103786e03b7f6257b6b489dfc49ca6712423a2e
          #   project: PlayCover.xcodeproj
          #   target: //Targets/PlayCover

          # The one kept out by us rather than by the toolchain: Xcode builds
          # it in 64s, and the generated build does not. Access levels across
          # the app target and its local packages (`property 'inlineDelimiters'
          # must be declared public because it matches a requirement in public
          # protocol`) and an expression the compiler gives up type-checking.
          # Worth revisiting — it is a bug report, not a dead end.
          # - name: CotEditor
          #   repo: https://github.com/coteditor/CotEditor
          #   rev: 545031e89383b7a20b1b2be4a846fca02dbf9c0f
          #   project: CotEditor.xcodeproj
          #   target: //Targets/CotEditor
    steps:
      # The disk cache holds what a build produced, the repository cache what it
      # downloaded, and `.build` what SwiftPM resolved for the app's packages:
      # generation resolves that graph before a single rule is written.
      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.name }}-${{ matrix.rev }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.name }}-${{ matrix.rev }}-
            ${{ runner.os }}-bazel-${{ matrix.name }}-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc
          echo "common --experimental_repository_downloader_retries=10" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Clone ${{ matrix.name }}
        run: |
          chmod +x bazelize
          git clone --filter=blob:none "${{ matrix.repo }}" "${{ matrix.name }}"
          git -C "${{ matrix.name }}" checkout --detach "${{ matrix.rev }}"

      # After the clone: a restored cache would otherwise create the directory
      # `git clone` insists on creating itself.
      - name: SwiftPM Cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.name }}/App/.build
          key: ${{ runner.os }}-spm-${{ matrix.name }}-${{ matrix.rev }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.name }}-

      - name: Check out submodules
        if: matrix.submodules
        working-directory: ${{ matrix.name }}
        run: git submodule update --init --recursive

      - name: Set up ${{ matrix.name }}
        if: matrix.setup
        working-directory: ${{ matrix.name }}
        run: ${{ matrix.setup }}

      - name: Bazel Generation
        run: |
          ./bazelize --input "${{ matrix.name }}/${{ matrix.project }}" --output "${{ matrix.name }}/App" | tee bazelize.log
          ! grep -q "did not run the" bazelize.log

      - name: Build Application
        working-directory: ${{ matrix.name }}/App
        run: |
          bazel build ${{ matrix.target }} \
            --build_event_json_file="$GITHUB_WORKSPACE/build-events.json"

      # What the lane built, kept: a bundle that can be downloaded and opened
      # is the only way to see what a generated build actually produces.
      # rules_apple packages a macOS application as a `.zip` and an iOS one as
      # an `.ipa`, and a lane that builds `//...` produces more than one.
      #
      # What the build produced is read out of its own event stream rather than
      # asked for again: a bundle rule transitions its configuration, so the
      # output is not under the `bazel-bin` symlink — which a multi-platform
      # build deletes anyway — and a second `cquery` is a second analysis that
      # can disagree with the build that just succeeded.
      #
      # A macOS application is re-packaged as a disk image. `upload-artifact`
      # zips whatever it is given and follows symlinks doing it, which flattens
      # the `Versions/Current` links every framework bundle is made of and
      # breaks the signature with them: what comes back out is an application
      # macOS refuses to open. A `.dmg` is one opaque file, so it arrives as it
      # left.
      #
      # The signature is ad-hoc either way — no identity exists on a runner —
      # so Gatekeeper still asks before the first launch. These are build
      # artifacts to look at, not a release.
      - name: Collect ${{ matrix.name }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          python3 - <<'PY'
          import json, os, shutil

          workspace = os.environ["GITHUB_WORKSPACE"]
          wanted = (".ipa", ".zip")
          produced = set()

          with open(f"{workspace}/build-events.json") as events:
              for line in events:
                  files = json.loads(line).get("namedSetOfFiles", {}).get("files", [])
                  for file in files:
                      uri = file.get("uri", "")
                      if not uri.startswith("file://") or not uri.endswith(wanted):
                          continue
                      if "__internal__" in uri:
                          continue
                      produced.add(uri[len("file://"):])

          for path in sorted(produced):
              shutil.copy(path, f"{workspace}/artifacts/")
          PY

          cd "$GITHUB_WORKSPACE/artifacts"
          for archive in *.zip; do
            [ -f "$archive" ] || continue
            name="${archive%.zip}"
            staging=$(mktemp -d)
            unzip -q "$archive" -d "$staging"
            # Only an application is worth a disk image; a framework or a test
            # bundle stays the archive Bazel wrote.
            if [ -d "$staging/$name.app" ]; then
              hdiutil create -quiet -volname "$name" -srcfolder "$staging" \
                -ov -format UDZO "$name.dmg"
              rm -f "$archive"
            fi
            rm -rf "$staging"
          done
          ls -l "$GITHUB_WORKSPACE/artifacts"

      - name: Upload ${{ matrix.name }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: artifacts
          if-no-files-found: warn

  # Real packages complement the focused fixtures below. Each revision is
  # immutable; SwiftPM first proves the checkout builds, then Bazel proves the
  # generated rule for its primary product builds. Upstream test suites are not
  # used as the control because several encode host locale, timing, or compiler
  # assumptions unrelated to generated build fidelity.
  IntegrateExternalPackage:
    name: IntegrateExternalPackage (${{ matrix.name }})
    runs-on: macos-26
    needs: [artifact]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swift-collections
            repo: https://github.com/apple/swift-collections
            rev: 3b69cedbaa49957e97c092ae400bb57602ef941f
            target: //Packages/swift-collections:Collections
          - name: SwiftFormat
            repo: https://github.com/nicklockwood/SwiftFormat
            rev: fbc07aca537317b8ecdde8fc22914cdd16d989a2
            target: //Packages/SwiftFormat:swiftformat
          - name: swift-protobuf
            repo: https://github.com/apple/swift-protobuf
            rev: ad92f08214402fae0e4ab1664fc65c76c1c0fa32
            target: //Packages/swift-protobuf:SwiftProtobuf
          - name: GRDB.swift
            repo: https://github.com/groue/GRDB.swift
            rev: 0d8cf958b4b66a0473ec6e6986eb9da462171da9
            target: //Packages/GRDB.swift:GRDB
          - name: swift-nio
            repo: https://github.com/apple/swift-nio
            rev: 6db9d9abd92ad7399b8a564cafbb87d3507245fa
            target: //Packages/swift-nio:NIOCore
          - name: swift-dependencies
            repo: https://github.com/pointfreeco/swift-dependencies
            rev: b476cc5761057d8d857de063fe7ac8daecf5c06b
            target: //Packages/swift-dependencies:Dependencies
    steps:
      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-package-${{ matrix.name }}-${{ matrix.rev }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-package-${{ matrix.name }}-${{ matrix.rev }}-
            ${{ runner.os }}-bazel-package-${{ matrix.name }}-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc
          echo "common --experimental_repository_downloader_retries=10" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      # The checkout directory is the package directory the generated workspace
      # files rules under, so it is named after the package rather than
      # something generic.
      - name: Clone ${{ matrix.name }}
        run: |
          chmod +x bazelize
          git clone --filter=blob:none "${{ matrix.repo }}" "${{ matrix.name }}"
          git -C "${{ matrix.name }}" checkout --detach "${{ matrix.rev }}"

      - name: SwiftPM Cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.name }}/.build
          key: ${{ runner.os }}-spm-package-${{ matrix.name }}-${{ matrix.rev }}
          restore-keys: |
            ${{ runner.os }}-spm-package-${{ matrix.name }}-

      - name: SwiftPM Build
        working-directory: ${{ matrix.name }}
        run: swift build

      - name: Bazel Generation
        run: ./bazelize --input "${{ matrix.name }}" --output "${{ matrix.name }}/App"

      - name: Build Package Product
        working-directory: ${{ matrix.name }}/App
        run: bazel build ${{ matrix.target }}

  # One lane per SwiftPM fixture in `spm/`: each package is one thing SwiftPM
  # can do, and its tests only pass if that thing was generated correctly.
  IntegratePackage:
    name: IntegratePackage (${{ matrix.name }})
    runs-on: macos-26
    needs: [artifact]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ArtifactBundle
            # A package rule carries `manual`, so a wildcard build never picks
            # one up: a program a package builds is named to be run.
            programs: |
              //Packages/ArtifactBundle:GreetTool -- /tmp/artifact-bundle.swift
          - name: BinaryTarget
          - name: BuildToolPlugin
          - name: Clang
          - name: CommandPlugin
            programs: |
              //Packages/CommandPlugin:hello
          - name: ConfigurationCondition
          - name: DependencyCondition
            # A trait is a flag, so the build that turns one on is a build to
            # test as well: the dependency behind it is linked only then.
            config: DependencyCondition.Extras
          - name: DependencyShape
          - name: ExecutableResource
            programs: |
              //Packages/ExecutableResource:resource-probe
          - name: Macro
          - name: Platform
          - name: PluginDependency
          - name: PrebuildPlugin
          - name: ProductShapes
            programs: |
              //Packages/Products:renamed-tool
              //Packages/Products:ProductSnippet
          - name: RemoteArtifactBundle
          - name: RemoteXCFramework
          - name: SwiftSettings
          - name: SystemLibrary
          # Which build system SwiftPM runs by default moves with the
          # toolchain, and the two do not implement the same resource rules, so
          # a lane about a resource rule names the one that implements it
          # rather than inheriting whichever the runner ships.
          - name: TargetEmbed
            # `swiftbuild` generated nothing for `.embedInCode` on the toolchain
            # this lane was written against — Xcode 27 does — and `native` has
            # generated it all along.
            swiftpm: --build-system native
          - name: TargetExclude
          - name: TargetPath
          - name: TargetResource
            # `native` copies a platform resource rather than compiling it: no
            # `momc`, no `actool`, no `ibtool`, so the model this package is
            # about arrives as the `.xcdatamodeld` that was written.
            swiftpm: --build-system swiftbuild
          - name: TargetSources
          - name: Trait
            traits: Fast,Slow
          - name: TraitGraph
            traits: Alternative,Leaf,Middle,Top
    steps:
      - uses: actions/checkout@v6

      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.name }}-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc
          echo "common --experimental_repository_downloader_retries=10" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      # What the fixture holds bazelize to is what SwiftPM does, so what
      # SwiftPM does is run too: a fixture whose two sides disagree is a
      # fixture that proves nothing.
      #
      # Every package of the fixture, not only the one bazelize is pointed at:
      # the packages beside it are dependencies with sources of their own, and
      # one that stopped building would be found here rather than in whatever
      # it broke. A package with no tests is built and not run — there is
      # nothing to run — and `App/` is generated, not a package of the fixture.
      # A package that is only a plugin has nothing to build either: SwiftPM
      # refuses the build rather than doing nothing, so it is skipped by what
      # its manifest declares.

      - name: SwiftPM Build And Test
        working-directory: spm/${{ matrix.name }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/spm/${{ matrix.name }}/vendor/pkgconfig
          ARGS: ${{ matrix.swiftpm }}
        run: |
          status=0
          while read -r manifest; do
            package=$(dirname "$manifest")
            echo "::group::$package"
            if ! (cd "$package" && swift package dump-package |
                    jq -e '[.targets[] | select(.type != "plugin")] | length > 0' > /dev/null); then
              echo "only plugins here, nothing to build"
            elif ! (cd "$package" && swift build $ARGS); then
              echo "::error::swift build failed for $package"
              status=1
            elif [ -d "$package/Tests" ] && ! (cd "$package" && swift test $ARGS); then
              echo "::error::swift test failed for $package"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name Package.swift -not -path "*/App/*" -not -path "*/.build/*" | sort)
          exit $status

      # A package that wraps a system library is found through `pkg-config`,
      # and a fixture that ships its own `.pc` is only found when that file's
      # directory is on the path.
      #
      # A note is the generator saying the build differs from what the package
      # asked for — a plugin that did not run, a program whose resources
      # nothing can bundle, a library pkg-config has never heard of. Every one
      # of those builds and tests green and is wrong at run time, so no fixture
      # may produce one silently: a lane expecting a note names it in `notes`,
      # and anything else said is a failure.
      - name: Bazel Generation
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/spm/${{ matrix.name }}/vendor/pkgconfig
          NOTES: ${{ matrix.notes }}
        run: |
          chmod +x bazelize
          ./bazelize --input "spm/${{ matrix.name }}" --output "spm/${{ matrix.name }}/App" | tee bazelize.log

          if [ -n "$NOTES" ]; then
            if ! grep -qE "$NOTES" bazelize.log; then
              echo "::error::the note this fixture is here for was not said: $NOTES"
              exit 1
            fi
          elif [ -s bazelize.log ]; then
            echo "::error::the generator said something no fixture expects"
            exit 1
          fi

      - name: Check Generated Starlark
        continue-on-error: true
        working-directory: spm/${{ matrix.name }}/App
        run: bazel run //:lint

      # Nothing runs the plugins here: generation ends with `bazel run
      # //:plugins`, so a target whose sources a plugin generates compiles in
      # `Test Package` below, or the generator failed to run them and said so.

      # The workspace's own commands, which answer whatever the package is:
      # a package with no trait, no configuration and no localization answers
      # that.
      - name: List Workspace
        working-directory: spm/${{ matrix.name }}/App
        run: |
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list config
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list trait
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list language

      # A build that names a localization bundles that one and `Base`, and
      # nothing else. What is in the bundle is the only proof of that.
      - name: Filter Localizations
        if: matrix.name == 'TargetResource'
        working-directory: spm/TargetResource/App
        run: |
          bazel build //Packages/TargetResource:TargetResourceTests --config=lang.en
          bundle=$(find -L bazel-bin/Packages/TargetResource -name TargetResourceTests.zip | head -1)
          unzip -Z1 "$bundle" | grep -q "en.lproj"
          unzip -Z1 "$bundle" | grep -q "Base.lproj"
          ! unzip -Z1 "$bundle" | grep -q "ja.lproj"
          ! unzip -Z1 "$bundle" | grep -q "de.lproj"

      # A command plugin is not run by a build: it is a verb someone types, and
      # running it is the only proof it is there. The fixture also has an
      # executable product named `hello`, so the command target is disambiguated
      # as `hello_command`.
      - name: Run Command Plugin
        if: matrix.name == 'CommandPlugin'
        working-directory: spm/CommandPlugin/App
        run: |
          bazel run //Packages/CommandPlugin:hello_command -- alpha --beta > command.log
          grep -q "Hello from CommandPlugin" command.log
          grep -q "Arguments: alpha --beta" command.log

      # `bazel test` treats an empty wildcard as an error. Executable-only and
      # library-only fixtures still build above; ask Bazel whether there is
      # anything for this step to run instead of inventing a no-op test.
      - name: Test Package
        working-directory: spm/${{ matrix.name }}/App
        run: |
          tests=$(bazel query 'tests(//...)')
          if [ -n "$tests" ]; then
            bazel test //...
          else
            echo "no Bazel tests, nothing to test"
          fi

      # One generated library is compiled through two platform configurations:
      # each gets its own settings and only iOS gets the conditional target.
      # Optimized iOS keeps the platform condition but drops the debug half of
      # a combined condition.
      - name: Test Platform Conditions
        if: matrix.name == 'Platform'
        working-directory: spm/Platform/App
        run: |
          bazel build //Packages/Platform:Platform --platforms=@apple_support//platforms:ios_sim_arm64

          mac=$(bazel aquery 'mnemonic("SwiftCompile", deps(//Packages/Platform:Platform))')
          ios=$(bazel aquery --platforms=@apple_support//platforms:ios_sim_arm64 \
            'mnemonic("SwiftCompile", deps(//Packages/Platform:Platform))')
          ios_opt=$(bazel aquery -c opt --platforms=@apple_support//platforms:ios_sim_arm64 \
            'mnemonic("SwiftCompile", deps(//Packages/Platform:Platform))')

          printf '%s' "$mac" | grep -q -- '-DMACOS_PLATFORM'
          ! printf '%s' "$mac" | grep -q -- '-DIOS_PLATFORM'
          ! printf '%s' "$mac" | grep -q 'Sources/IOSOnly/IOSOnly.swift'

          printf '%s' "$ios" | grep -q -- '-DIOS_PLATFORM'
          printf '%s' "$ios" | grep -q -- '-DIOS_DEBUG'
          ! printf '%s' "$ios" | grep -q -- '-DMACOS_PLATFORM'
          printf '%s' "$ios" | grep -q 'Sources/IOSOnly/IOSOnly.swift'

          printf '%s' "$ios_opt" | grep -q -- '-DIOS_PLATFORM'
          ! printf '%s' "$ios_opt" | grep -q -- '-DIOS_DEBUG'

      # A program is not a test: the rules that build one carry `manual`, so
      # `//...` never builds it. Running it is what says it links and works.
      - name: Run Package Programs
        if: matrix.programs
        working-directory: spm/${{ matrix.name }}/App
        env:
          PROGRAMS: ${{ matrix.programs }}
        run: |
          while read -r program; do
            [ -n "$program" ] || continue
            bazel run $program
          done <<< "$PROGRAMS"

      # Both ways round, and not only that both pass: a trait is a compilation
      # condition named after itself, so the flag reaching swiftc is the thing
      # to see.
      - name: Test Package With Trait
        if: matrix.config
        working-directory: spm/${{ matrix.name }}/App
        run: |
          bazel test //... --config=${{ matrix.config }}
          trait="${{ matrix.config }}"
          ! bazel aquery 'mnemonic("SwiftCompile", //...)' | grep -q -- "-D${trait#*.}"
          bazel aquery --config=${{ matrix.config }} 'mnemonic("SwiftCompile", //...)' | grep -q -- "-D${trait#*.}"

      # Select each declared trait on its own, through the `--config` the
      # workspace generated for it. That is what `swift test --traits <trait>`
      # does: the selection replaces the package's defaults, and carries
      # whatever that trait enables.
      - name: Test Each Package Trait
        if: matrix.traits
        working-directory: spm/${{ matrix.name }}/App
        env:
          PACKAGE: ${{ matrix.name }}
          TRAITS: ${{ matrix.traits }}
        run: |
          IFS=',' read -ra traits <<< "$TRAITS"
          for trait in "${traits[@]}"; do
            bazel test //... "--config=${PACKAGE}.${trait}"
          done

      # What each selection resolves to, exactly: the closure of the trait
      # asked for, and nothing of the defaults it replaced. The three SwiftPM
      # names rather than lists — `--disable-default-traits`,
      # `--enable-all-traits`, `--traits default` — answer the same here.
      - name: Probe Trait Selections
        if: matrix.name == 'TraitGraph'
        working-directory: spm/TraitGraph/App
        run: |
          bazel run //Packages/TraitGraph:TraitProbe -- Leaf Middle Top
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.Middle -- Leaf Middle
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.Alternative -- Alternative
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.none
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.all -- Alternative Leaf Middle Top
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.default -- Leaf Middle Top
