name: Swift

on: 
  push:
    branches: 
      - master
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'spm/**'
      - '.github/workflows/**'
      - 'Package.swift'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'spm/**'
      - '.github/workflows/**'
      - 'Package.swift'

concurrency: 
  group: ci
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v6

    - name: Check Xcode Version
      run: |
        xcodebuild -version
        swift --version
        swift package --version

    - name: Get swift version
      run: swift --version # Swift 5.3.3

    - name: SPM Cache
      uses: actions/cache@v5
      with:
        path: .build
        key: ${{ runner.os }}-macos-26-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-macos-26-spm-

    - name: Build
      run: make build

    - name: Run tests
      run: make test

  artifact:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: SPM Cache
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Bazelize
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Upload Bazelize
        uses: actions/upload-artifact@v7
        with:
          name: bazelize
          path: .build/apple/Products/Release/bazelize
          if-no-files-found: ignore # 'warn' or 'ignore' 

  IntegrateIOS:
    runs-on: macos-26
    needs: [artifact]
    steps:
      - uses: actions/checkout@v6

      # Every `bazel` in this job reads these: the disk cache holds what the
      # build produced, the repository cache what it downloaded. Without the
      # second one a runner fetches rules_apple and the rest again every time.
      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-IntegrateIOS-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-IntegrateIOS-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Check
        run: |
          ls -l
          pwd
          chmod +x bazelize

      # A plugin that did not run leaves the target missing the sources it
      # generates, and the compile error that follows names those sources rather
      # than the plugin. The run says so; the lane stops there.
      - name: Bazel Generation
        working-directory: fixture/iOS
        run: |
          ../../bazelize --project Example.xcodeproj --output App | tee bazelize.log
          ! grep -q "did not run the" bazelize.log

      - name: Build Application
        working-directory: fixture/iOS/App
        run: |
          bazel build //Targets/Example

      - name: Copy IPA
        working-directory: fixture/iOS/App
        run: |
          cp "$(bazel cquery //Targets/Example --output=files | grep '\.ipa$')" ../Example.ipa

      # A simulator test on a runner pays for booting the simulator, and four of
      # them booting at once pay for it four times over: the first test took
      # 247s here and the last timed out at 302s having never started. One
      # simulator is booted up front, outside any test's clock, and the tests
      # run one at a time so they share it.
      #
      # Which simulator is the runner's business, not ours: it has whatever
      # runtime its Xcode ships, which is not the one this repository is
      # developed against.
      - name: Boot Simulator
        run: |
          # A device name has spaces in it, so one field per line.
          { read -r device; read -r version; read -r udid; } < <(python3 - <<'PY'
          import json, subprocess

          def simctl(*arguments):
              listed = subprocess.run(["xcrun", "simctl", "list", "-j", *arguments], capture_output=True, text=True)
              return json.loads(listed.stdout)

          runtimes = [runtime for runtime in simctl("runtimes")["runtimes"]
                      if runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")
                      and runtime.get("isAvailable")]
          runtimes.sort(key=lambda runtime: [int(part) for part in runtime["version"].split(".")])
          runtime = runtimes[-1]

          devices = [device for device in simctl("devices", "available")["devices"].get(runtime["identifier"], [])
                     if device["name"].startswith("iPhone")]
          if devices:
              name, udid = devices[-1]["name"], devices[-1]["udid"]
          else:
              kinds = [kind for kind in simctl("devicetypes")["devicetypes"] if kind["name"].startswith("iPhone")]
              name = kinds[-1]["name"]
              created = subprocess.run(
                  ["xcrun", "simctl", "create", name, kinds[-1]["identifier"], runtime["identifier"]],
                  capture_output=True, text=True)
              udid = created.stdout.strip()

          print(name)
          print(runtime["version"])
          print(udid)
          PY
          )
          echo "Simulator: $device, iOS $version ($udid)"
          echo "SIMULATOR_DEVICE=$device" >> "${GITHUB_ENV:-/dev/null}"
          echo "SIMULATOR_VERSION=$version" >> "${GITHUB_ENV:-/dev/null}"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid"

      - name: Unit Test
        working-directory: fixture/iOS/App
        run: |
          bazel test \
            --@build_bazel_rules_apple//apple/build_settings:ios_simulator_device="$SIMULATOR_DEVICE" \
            --@build_bazel_rules_apple//apple/build_settings:ios_simulator_version="$SIMULATOR_VERSION" \
            --local_test_jobs=1 \
            --test_timeout=900 \
            --test_output=errors \
            //Targets/ExampleTests \
            //Targets/Framework1Tests \
            //Targets/Framework2Tests \
            //Targets/Framework3Tests

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS_Example.ipa
          path: fixture/iOS/Example.ipa
          if-no-files-found: ignore # 'warn' or 'ignore'

  # The corpus is not in this repository: `app/` and `spm/` are ignored, so each
  # lane clones what it measures at the revision it was measured against.
  IntegrateApp:
    name: IntegrateApp (${{ matrix.name }})
    runs-on: macos-26
    needs: [artifact]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: stats
            repo: https://github.com/exelban/stats
            rev: b4251e2ba05511de6b51b296d7b9e98a9c6545f5
            project: Stats.xcodeproj
            target: //Targets/Stats
          - name: MonitorControl
            repo: https://github.com/MonitorControl/MonitorControl
            rev: 71b8c5ae51955d17b05688371ea7b899b684bdbd
            project: MonitorControl.xcodeproj
            target: //Targets/MonitorControl
          - name: SwiftBar
            repo: https://github.com/swiftbar/SwiftBar
            rev: 05cb6cb1123bc7227ee2b39f390f8bccb839fed0
            project: SwiftBar.xcodeproj
            target: //Targets/SwiftBar
          - name: Rectangle
            repo: https://github.com/rxhanson/Rectangle
            rev: b4c9c47c00b4df9cbfb3489dc5eae2f1249ad24a
            project: Rectangle.xcodeproj
            target: //...
          - name: VirtualBuddy
            repo: https://github.com/insidegui/VirtualBuddy
            rev: 088351b0fc67e0b24b83e7954ad48314dda4ce04
            project: VirtualBuddy.xcodeproj
            target: //Targets/VirtualBuddy
          # Not yet green on a runner, so not yet a lane. iina is the app the
          # notes still list an open problem for, and MacPass needs its
          # submodules and a Carthage bootstrap that nothing here has proven.
          # - name: iina
          #   repo: https://github.com/iina/iina
          #   rev: c111221ea027466b79b40bfca054772d4851e06f
          #   project: iina.xcodeproj
          #   target: //Targets/iina
          # - name: MacPass
          #   repo: https://github.com/MacPass/MacPass
          #   rev: 3256bc93ea94eb20b618c155e6a1b08e6fabe663
          #   project: MacPass.xcodeproj
          #   target: //Targets/MacPass
          #   submodules: true
          #   setup: carthage bootstrap --platform macOS --cache-builds
    steps:
      # The disk cache holds what a build produced, the repository cache what it
      # downloaded, and `.build` what SwiftPM resolved for the app's packages:
      # generation resolves that graph before a single rule is written.
      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.name }}-${{ matrix.rev }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.name }}-${{ matrix.rev }}-
            ${{ runner.os }}-bazel-${{ matrix.name }}-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Clone ${{ matrix.name }}
        run: |
          chmod +x bazelize
          git clone --filter=blob:none "${{ matrix.repo }}" "${{ matrix.name }}"
          git -C "${{ matrix.name }}" checkout --detach "${{ matrix.rev }}"

      # After the clone: a restored cache would otherwise create the directory
      # `git clone` insists on creating itself.
      - name: SwiftPM Cache
        uses: actions/cache@v5
        with:
          path: ${{ matrix.name }}/App/.build
          key: ${{ runner.os }}-spm-${{ matrix.name }}-${{ matrix.rev }}
          restore-keys: |
            ${{ runner.os }}-spm-${{ matrix.name }}-

      - name: Check out submodules
        if: matrix.submodules
        working-directory: ${{ matrix.name }}
        run: git submodule update --init --recursive

      - name: Set up ${{ matrix.name }}
        if: matrix.setup
        working-directory: ${{ matrix.name }}
        run: ${{ matrix.setup }}

      - name: Bazel Generation
        run: |
          ./bazelize --project "${{ matrix.name }}/${{ matrix.project }}" --output "${{ matrix.name }}/App" | tee bazelize.log
          ! grep -q "did not run the" bazelize.log

      - name: Build Application
        working-directory: ${{ matrix.name }}/App
        run: bazel build ${{ matrix.target }}

  # One lane per SwiftPM fixture in `spm/`: each package is one thing SwiftPM
  # can do, and its tests only pass if that thing was generated correctly.
  IntegratePackage:
    name: IntegratePackage (${{ matrix.name }})
    runs-on: macos-26
    needs: [artifact]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ArtifactBundle
            plugins: true
            # A package rule carries `manual`, so a wildcard build never picks
            # one up: a program a package builds is named to be run.
            programs: |
              //Packages/ArtifactBundle:GreetTool -- /tmp/artifact-bundle.swift
          - name: BinaryTarget
          - name: BuildToolPlugin
            plugins: true
          - name: Clang
          - name: CommandPlugin
          - name: ConfigurationCondition
          - name: DependencyCondition
            # A trait is a flag, so the build that turns one on is a build to
            # test as well: the dependency behind it is linked only then.
            config: DependencyCondition.Extras
          - name: DependencyShape
          - name: Macro
          - name: Platform
          - name: PluginDependency
            plugins: true
          - name: PrebuildPlugin
            plugins: true
          - name: ProductShapes
            programs: |
              //Packages/Products:renamed-tool
              //Packages/Products:ProductSnippet
          - name: RemoteArtifactBundle
            plugins: true
          - name: RemoteXCFramework
          - name: SwiftSettings
          - name: SystemLibrary
          - name: TargetEmbed
            # `.embedInCode` generates nothing under the default build system
            # in this toolchain, which is SwiftPM's own gap rather than
            # anything this package does — and the only reason this rule has a
            # package of its own.
            swiftpm: --build-system native
          - name: TargetExclude
          - name: TargetPath
          - name: TargetResource
          - name: TargetSources
          - name: Trait
            traits: Fast,Slow
          - name: TraitGraph
            traits: Alternative,Leaf,Middle,Top
    steps:
      - uses: actions/checkout@v6

      - name: Bazel Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: ${{ runner.os }}-bazel-${{ matrix.name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bazel-${{ matrix.name }}-

      - name: Bazel Cache Settings
        run: |
          echo "build --disk_cache=$HOME/bazel-disk" >> ~/.bazelrc
          echo "build --repository_cache=$HOME/bazel-repo" >> ~/.bazelrc

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      # What the fixture holds bazelize to is what SwiftPM does, so what
      # SwiftPM does is run too: a fixture whose two sides disagree is a
      # fixture that proves nothing.
      #
      # Every package of the fixture, not only the one bazelize is pointed at:
      # the packages beside it are dependencies with sources of their own, and
      # one that stopped building would be found here rather than in whatever
      # it broke. A package with no tests is built and not run — there is
      # nothing to run — and `App/` is generated, not a package of the fixture.
      - name: SwiftPM Build And Test
        working-directory: spm/${{ matrix.name }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/spm/${{ matrix.name }}/vendor/pkgconfig
          ARGS: ${{ matrix.swiftpm }}
        run: |
          status=0
          while read -r manifest; do
            package=$(dirname "$manifest")
            echo "::group::$package"
            if ! (cd "$package" && swift build $ARGS); then
              echo "::error::swift build failed for $package"
              status=1
            elif [ -d "$package/Tests" ] && ! (cd "$package" && swift test $ARGS); then
              echo "::error::swift test failed for $package"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name Package.swift -not -path "*/App/*" -not -path "*/.build/*" | sort)
          exit $status

      # A package that wraps a system library is found through `pkg-config`,
      # and a fixture that ships its own `.pc` is only found when that file's
      # directory is on the path.
      - name: Bazel Generation
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/spm/${{ matrix.name }}/vendor/pkgconfig
        run: |
          chmod +x bazelize
          ./bazelize --project "spm/${{ matrix.name }}" --output "spm/${{ matrix.name }}/App"

      # A build tool plugin is a program: Bazel builds it and bazelize runs it,
      # which is what puts the sources it generates where the rules glob for
      # them. Only the packages that have one need the step.
      - name: Run Plugins
        if: matrix.plugins
        working-directory: spm/${{ matrix.name }}/App
        run: PATH="$GITHUB_WORKSPACE:$PATH" bazel run //:plugins

      # The workspace's own commands, which answer whatever the package is:
      # a package with no trait and no configuration answers that.
      - name: List Workspace
        working-directory: spm/${{ matrix.name }}/App
        run: |
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list config
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list trait

      - name: Test Package
        working-directory: spm/${{ matrix.name }}/App
        run: bazel test //...

      # A program is not a test: the rules that build one carry `manual`, so
      # `//...` never builds it. Running it is what says it links and works.
      - name: Run Package Programs
        if: matrix.programs
        working-directory: spm/${{ matrix.name }}/App
        env:
          PROGRAMS: ${{ matrix.programs }}
        run: |
          while read -r program; do
            [ -n "$program" ] || continue
            bazel run $program
          done <<< "$PROGRAMS"

      # Both ways round, and not only that both pass: a trait is a compilation
      # condition named after itself, so the flag reaching swiftc is the thing
      # to see.
      - name: Test Package With Trait
        if: matrix.config
        working-directory: spm/${{ matrix.name }}/App
        run: |
          bazel test //... --config=${{ matrix.config }}
          trait="${{ matrix.config }}"
          ! bazel aquery 'mnemonic("SwiftCompile", //...)' | grep -q -- "-D${trait#*.}"
          bazel aquery --config=${{ matrix.config }} 'mnemonic("SwiftCompile", //...)' | grep -q -- "-D${trait#*.}"

      # Select each declared trait on its own, through the `--config` the
      # workspace generated for it. That is what `swift test --traits <trait>`
      # does: the selection replaces the package's defaults, and carries
      # whatever that trait enables.
      - name: Test Each Package Trait
        if: matrix.traits
        working-directory: spm/${{ matrix.name }}/App
        env:
          PACKAGE: ${{ matrix.name }}
          TRAITS: ${{ matrix.traits }}
        run: |
          IFS=',' read -ra traits <<< "$TRAITS"
          for trait in "${traits[@]}"; do
            bazel test //... "--config=${PACKAGE}.${trait}"
          done

      # What each selection resolves to, exactly: the closure of the trait
      # asked for, and nothing of the defaults it replaced.
      - name: Probe Trait Selections
        if: matrix.name == 'TraitGraph'
        working-directory: spm/TraitGraph/App
        run: |
          bazel run //Packages/TraitGraph:TraitProbe -- Leaf Middle Top
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.Middle -- Leaf Middle
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.Alternative -- Alternative
