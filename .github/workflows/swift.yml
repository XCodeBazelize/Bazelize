name: Swift

on: 
  push:
    branches: 
      - master
      - main
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
      - 'v[0-9]*.[0-9]*.[0-9]*'
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'spm/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'
      - 'Plugins/**'
      - '.github/actions/**'
      - 'fixture/iOS/**'
      - 'mise.toml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'spm/**'
      - '.github/workflows/**'
      - '.github/scripts/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'Makefile'
      - 'Plugins/**'
      - '.github/actions/**'
      - 'fixture/iOS/**'
      - 'mise.toml'

permissions:
  contents: read

# Share hosted macOS capacity with Compatibility, one complete validation at a
# time. Keep pending runs rather than replacing another PR's queued checks.
concurrency:
  group: macos-validation
  cancel-in-progress: false
  queue: max

jobs:
  test:
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
    - uses: actions/checkout@v6

    - uses: jdx/mise-action@v4
      with:
        install_args: tuist
        cache_save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

    # The snapshot tests read the generated fixture project.
    - name: Generate iOS fixture
      run: |
        tuist generate --path fixture/iOS --no-open
        python3 .github/scripts/prepare-xcode-fixture.py

    - name: SPM Cache
      uses: ./.github/actions/swift-cache
      with:
        group: root-debug
        path: .build
        dependencies: ${{ hashFiles('Package.resolved') }}

    - name: Test bundle comparison
      run: python3 .github/scripts/test_compare_bundles.py

    - name: Test generated workspace comparison
      run: python3 .github/scripts/test_compare_generated_workspaces.py

    - name: Test release eligibility
      run: python3 .github/scripts/test_release.py

    - name: Build debug products
      run: make build

    - name: Run tests
      run: make test

  artifact:
    uses: ./.github/workflows/build-bazelize.yml


  IntegrateIOS:
    name: IntegrateIOS (${{ matrix.format }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: pbxproj
            runner: macos-26
          - format: xcproj
            runner: xcode-27
    runs-on: ${{ matrix.runner }}
    needs: [artifact]
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install_args: tuist
          cache_save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Select Xcode 27.2
        if: matrix.format == 'xcproj'
        run: sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer

      - name: Generate Xcode project
        run: |
          tuist generate --path fixture/iOS --no-open
          python3 .github/scripts/prepare-xcode-fixture.py

      # Every `bazel` in this job reads these: the disk cache holds what the
      # build produced, the repository cache what it downloaded. Without the
      # second one a runner fetches rules_apple and the rest again every time.
      - name: Bazel Cache
        uses: ./.github/actions/bazel-cache
        with:
          group: IntegrateIOS-${{ matrix.format }}
          save-repository: ${{ matrix.format == 'pbxproj' }}

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Check
        run: |
          ls -l
          pwd
          chmod +x bazelize

      # Both project formats describe one project, so both generate one
      # workspace. The traditional file is still here before the conversion:
      # what it generates is kept, to be compared with what the JSON file does.
      - name: Generate From Traditional Project
        if: matrix.format == 'xcproj'
        working-directory: fixture/iOS
        run: |
          ../../bazelize --input Example.xcodeproj --output App-pbxproj

      - name: Convert Xcode project to JSON
        if: matrix.format == 'xcproj'
        working-directory: fixture/iOS
        run: |
          xcodebuild -project Example.xcodeproj -convert-project "Xcode Project"
          test -f Example.xcodeproj/project.xcproj
          test ! -e Example.xcodeproj/project.pbxproj

      # A plugin that did not run leaves the target missing the sources it
      # generates, and the compile error that follows names those sources rather
      # than the plugin. The run says so; the lane stops there.
      - name: Bazel Generation
        working-directory: fixture/iOS
        run: |
          set -o pipefail
          ../../bazelize --input Example.xcodeproj --output App | tee bazelize.log
          ! grep -q "did not run the" bazelize.log

      # Workspace-local absolute links are relocated; external links retain their destinations.
      - name: Compare Generated Workspaces
        if: matrix.format == 'xcproj'
        working-directory: fixture/iOS
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/compare-generated-workspaces.py" App-pbxproj App

      # A simulator test on a runner pays for booting the simulator, and four of
      # them booting at once pay for it four times over: the first test took
      # 247s here and the last timed out at 302s having never started. The tests
      # run one at a time so they share one simulator, the one the rules_apple
      # runner reuses. It boots in the background under another name and takes
      # that name once ready, so tests served from cache never wait for it.
      #
      # It boots only after every step that runs Xcode's tools or restores a
      # cache: a fresh image's first boot migrates data for minutes, and beside
      # it `tuist generate` went from 25-53s to 285-394s and bazelize from 15-28s
      # to 302s. The Bazel analysis and builds that follow overlap it unslowed.
      #
      # Which simulator is the runner's business, not ours: it has whatever
      # runtime its Xcode ships, which is not the one this repository is
      # developed against. It is chosen after Xcode is.
      - name: Boot Simulator
        run: .github/scripts/boot-apple-simulator.sh

      - name: Check Generated Starlark
        working-directory: fixture/iOS/App
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-generated-starlark.sh"

      - name: Build Products
        working-directory: fixture/iOS/App
        run: bazel build //Targets/Example //Targets/MacBundle //Targets/ProductProbe

      - name: Run Per-File Flag Probe
        working-directory: fixture/iOS/App
        run: bazel run //Targets/PerFileFlags --config=Debug

      - name: Copy IPA
        working-directory: fixture/iOS/App
        run: |
          cp "$(bazel cquery //Targets/Example --output=files | grep '\.ipa$')" ../Example.ipa

      - name: Unit Test
        working-directory: fixture/iOS/App
        run: |
          bazel test \
            --@build_bazel_rules_apple//apple/build_settings:ios_simulator_device="$SIMULATOR_DEVICE" \
            --local_test_jobs=1 \
            --test_timeout=900 \
            --test_output=errors \
            //Targets/ExampleTests \
            //Targets/Framework1Tests \
            //Targets/Framework2Tests \
            //Targets/Framework3Tests

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS_Example-${{ matrix.format }}.ipa
          path: fixture/iOS/Example.ipa
          if-no-files-found: error

  # A build that compiles says nothing about what it ships. Xcode and the
  # generated workspace build the same macOS product bundle; their complete
  # trees and stable contents must match. Every accepted difference is named
  # in the checked-in baseline, and any new or stale difference fails.
  CompareBundles:
    runs-on: macos-26
    needs: [artifact]
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4
        with:
          install_args: tuist
          cache_save: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Generate Xcode project
        run: |
          tuist generate --path fixture/iOS --no-open
          python3 .github/scripts/prepare-xcode-fixture.py

      - name: Bazel Cache
        uses: ./.github/actions/bazel-cache
        with:
          group: CompareBundles

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      # `ENABLE_DEBUG_DYLIB` is Xcode's own debugging mechanism, not something
      # the app asked for: it adds a dylib and a preview stub that no build of
      # the same sources is expected to produce.
      - name: Build With Xcode
        working-directory: fixture/iOS
        run: |
          xcodebuild \
            -project Example.xcodeproj \
            -scheme Example \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/xcode" \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build

          xcodebuild \
            -project Example.xcodeproj \
            -scheme ProductProbe \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/xcode" \
            CODE_SIGNING_ALLOWED=NO ENABLE_DEBUG_DYLIB=NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES build

          xcodebuild \
            -project Example.xcodeproj \
            -scheme MacBundle \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/xcode" \
            CODE_SIGNING_ALLOWED=NO \
            build

          xcodebuild \
            -project Example.xcodeproj \
            -scheme PerFileFlags \
            -configuration Debug \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/xcode" \
            CODE_SIGNING_ALLOWED=NO \
            build
          "$RUNNER_TEMP/xcode/Build/Products/Debug/PerFileFlags"

      # After Xcode's build, not beside it: a first boot slows Xcode's tools
      # severalfold (see IntegrateIOS). The Bazel build overlaps it instead.
      - name: Boot Simulator for product proof
        run: .github/scripts/boot-apple-simulator.sh

      - name: Build With Bazel
        run: |
          chmod +x bazelize
          ./bazelize --input fixture/iOS/Example.xcodeproj --output fixture/iOS/App
          cd fixture/iOS/App
          bazel build //Targets/Example --config=Debug --ios_multi_cpus=sim_arm64
          bazel build //Targets/MacBundle --config=Debug
          bazel run //Targets/PerFileFlags --config=Debug
          bundle=$(bazel cquery //Targets/MacBundle --config=Debug --output=files |
            grep 'MacBundle.zip$')
          mkdir -p "$RUNNER_TEMP/bazel"
          unzip -q "$bundle" -d "$RUNNER_TEMP/bazel"
          bazel build //Targets/ProductProbe --config=Debug --ios_multi_cpus=sim_arm64 --remote_download_outputs=all
          ios_bundle=$(bazel cquery //Targets/ProductProbe --config=Debug --ios_multi_cpus=sim_arm64 --output=files |
            grep 'ProductProbe.ipa$')
          mkdir -p "$RUNNER_TEMP/bazel-ios"
          unzip -q "$ios_bundle" -d "$RUNNER_TEMP/bazel-ios"

      - name: Compare Product Bundle
        run: |
          python3 .github/scripts/compare-bundles.py \
            --reference "$RUNNER_TEMP/xcode/Build/Products/Debug/MacBundle.bundle" \
            --generated "$RUNNER_TEMP/bazel/MacBundle.bundle" \
            --baseline .github/scripts/bundle-differences.json

      - name: Wait for Simulator
        run: .github/scripts/wait-apple-simulator.sh

      - name: Compare iOS products and observe installed app
        run: |
          python3 .github/scripts/verify-ios-products.py \
            --reference "$RUNNER_TEMP/xcode/Build/Products/Debug-iphonesimulator/ProductProbe.app" \
            --generated "$RUNNER_TEMP/bazel-ios/Payload/ProductProbe.app" \
            --baseline .github/scripts/bundle-differences.json \
            --simulator "$SIMULATOR_UDID"

      # The symbols a catalog becomes are source the target compiles, so they are
      # compared as source: Xcode writes its copy into DerivedSources, and the two
      # files are expected to be identical.
      - name: Compare Asset Symbols
        run: |
          (cd fixture/iOS/App &&
            bazel build //Targets/Example:Example \
              --config=Debug \
              --ios_multi_cpus=sim_arm64 \
              --remote_download_outputs=all)
          xcode=$(find "$RUNNER_TEMP/xcode" -name GeneratedAssetSymbols.swift -path '*Example.build*' -print -quit)
          bazel_output=$(cd fixture/iOS/App &&
            bazel cquery 'filter("AssetSymbols", deps(//Targets/Example:Example))' \
              --config=Debug \
              --ios_multi_cpus=sim_arm64 \
              --output=files)
          bazel_execution_root=$(cd fixture/iOS/App && bazel info execution_root)
          bazel="$bazel_execution_root/$bazel_output"
          if [ -z "$xcode" ]; then
            echo "::error::Xcode did not produce GeneratedAssetSymbols.swift"
            exit 1
          fi
          if [ ! -f "$bazel" ]; then
            echo "::error::Bazel did not produce $bazel"
            exit 1
          fi
          diff "$xcode" "$bazel"


  # One lane per SwiftPM fixture in `spm/`: each package is one thing SwiftPM
  # can do, and its tests only pass if that thing was generated correctly.
  IntegratePackage:
    name: IntegratePackage (${{ matrix.name }})
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    needs: [artifact]
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: ArtifactBundle
            # A package rule carries `manual`, so a wildcard build never picks
            # one up: a program a package builds is named to be run.
            programs: |
              //Packages/ArtifactBundle:GreetTool -- /tmp/artifact-bundle.swift
          - name: BinaryTarget
          - name: BuildToolPlugin
          - name: Clang
          - name: CommandPlugin
            programs: |
              //Packages/CommandPlugin:hello
          - name: ConfigurationCondition
          - name: DependencyCondition
            # A trait is a flag, so the build that turns one on is a build to
            # test as well: the dependency behind it is linked only then.
            config: DependencyCondition.Extras
          - name: DependencyShape
          # Its test target compiles the back-port, so `bazel test //...` is
          # what says the graph's deployment floor reached the compile.
          - name: DeploymentFloor
          - name: ExecutableResource
            programs: |
              //Packages/ExecutableResource:resource-probe
          - name: Macro
          - name: Platform
          - name: PluginDependency
          - name: PrebuildPlugin
          - name: ProductShapes
            programs: |
              //Packages/Products:renamed-tool
              //Packages/Products:ProductSnippet
          - name: RemoteArtifactBundle
          - name: RegistryPackage
            notes: "swift package resolve failed"
          - name: RemoteXCFramework
          - name: SwiftSettings
          - name: SystemLibrary
          # Which build system SwiftPM runs by default moves with the
          # toolchain, and the two do not implement the same resource rules, so
          # a lane about a resource rule names the one that implements it
          # rather than inheriting whichever the runner ships.
          - name: TargetEmbed
            # `swiftbuild` generated nothing for `.embedInCode` on the toolchain
            # this lane was written against — Xcode 27 does — and `native` has
            # generated it all along.
            swiftpm: --build-system native
          - name: TargetExclude
          - name: TargetPath
          - name: TargetResource
            # `native` copies a platform resource rather than compiling it: no
            # `momc`, no `actool`, no `ibtool`, so the model this package is
            # about arrives as the `.xcdatamodeld` that was written.
            swiftpm: --build-system swiftbuild
          - name: TargetSources
          - name: Trait
            traits: Fast,Slow
          - name: TraitGraph
            traits: Alternative,Leaf,Middle,Top
    steps:
      - uses: actions/checkout@v6

      # The downloads cache is keyed by architecture and saved only by its
      # designated writer. IntegrateIOS writes the ARM one; this is the only
      # Intel writer, and Platform builds for macOS and iOS, so it fetches the
      # rules every other Intel lane shares. Without it each Intel job fetches
      # them from the network on every run.
      - name: Bazel Cache
        uses: ./.github/actions/bazel-cache
        with:
          group: package-${{ matrix.name }}
          save-repository: ${{ matrix.name == 'Platform' }}

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      # What the fixture holds bazelize to is what SwiftPM does, so what
      # SwiftPM does is run too: a fixture whose two sides disagree is a
      # fixture that proves nothing.
      #
      # Every package of the fixture, not only the one bazelize is pointed at:
      # the packages beside it are dependencies with sources of their own, and
      # one that stopped building would be found here rather than in whatever
      # it broke. A package with no tests is built and not run — there is
      # nothing to run — and `App/` is generated, not a package of the fixture.
      # A package that is only a plugin has nothing to build either: SwiftPM
      # refuses the build rather than doing nothing, so it is skipped by what
      # its manifest declares.
      #
      # Which packages those are is read from the manifest rather than the
      # directory tree: a test target names its own `path`, so `Tests/` being
      # absent says nothing about whether there are tests to run.

      - name: SwiftPM Build And Test
        if: matrix.name != 'RegistryPackage'
        working-directory: spm/${{ matrix.name }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/spm/${{ matrix.name }}/vendor/pkgconfig
          ARGS: ${{ matrix.swiftpm }}
        run: |
          status=0
          while read -r manifest; do
            package=$(dirname "$manifest")
            echo "::group::$package"
            # One manifest answers both questions: whether anything here is
            # built, and whether a test target exists wherever its `path` put
            # it.
            if ! model=$(cd "$package" && swift package dump-package); then
              echo "::error::swift package dump-package failed for $package"
              status=1
            elif ! jq -e '[.targets[] | select(.type != "plugin")] | length > 0' <<< "$model" > /dev/null; then
              echo "only plugins here, nothing to build"
            elif ! (cd "$package" && swift build $ARGS); then
              echo "::error::swift build failed for $package"
              status=1
            elif jq -e '[.targets[] | select(.type == "test")] | length > 0' <<< "$model" > /dev/null &&
              ! (cd "$package" && swift test $ARGS); then
              echo "::error::swift test failed for $package"
              status=1
            fi
            echo "::endgroup::"
          done < <(find . -name Package.swift -not -path "*/App/*" -not -path "*/.build/*" | sort)
          exit $status

      - name: Seed Offline Registry Download
        if: matrix.name == 'RegistryPackage'
        run: |
          mkdir -p spm/RegistryPackage/App/.build/registry/downloads
          cp -R spm/RegistryPackage/Registry/. spm/RegistryPackage/App/.build/registry/downloads/

      # A package that wraps a system library is found through `pkg-config`,
      # and a fixture that ships its own `.pc` is only found when that file's
      # directory is on the path.
      #
      # A note is the generator saying the build differs from what the package
      # asked for — a plugin that did not run, a program whose resources
      # nothing can bundle, a library pkg-config has never heard of. Every one
      # of those builds and tests green and is wrong at run time, so no fixture
      # may produce one silently: a lane expecting a note names it in `notes`,
      # and anything else said is a failure.
      - name: Bazel Generation
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/spm/${{ matrix.name }}/vendor/pkgconfig
          NOTES: ${{ matrix.notes }}
        run: |
          set -o pipefail
          chmod +x bazelize
          ./bazelize --input "spm/${{ matrix.name }}" --output "spm/${{ matrix.name }}/App" | tee bazelize.log

          if [ -n "$NOTES" ]; then
            if ! grep -qE "$NOTES" bazelize.log; then
              echo "::error::the note this fixture is here for was not said: $NOTES"
              exit 1
            fi
          elif [ -s bazelize.log ]; then
            echo "::error::the generator said something no fixture expects"
            exit 1
          fi

      - name: Check Generated Starlark
        working-directory: spm/${{ matrix.name }}/App
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-generated-starlark.sh"

      - name: Check Package Warning Policy
        if: matrix.name == 'SwiftSettings'
        run: python3 .github/scripts/check-package-warnings.py ./bazelize

      # Nothing runs the plugins here: generation ends with `bazel run
      # //:plugins`, so a target whose sources a plugin generates compiles in
      # `Test Package` below, or the generator failed to run them and said so.

      # The workspace's own commands, which answer whatever the package is:
      # a package with no trait, no configuration and no localization answers
      # that.
      - name: List Workspace
        working-directory: spm/${{ matrix.name }}/App
        run: |
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list config
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list trait
          PATH="$GITHUB_WORKSPACE:$PATH" bazel list language

      # A build that names a localization bundles that one and `Base`, and
      # nothing else. What is in the bundle is the only proof of that.
      - name: Filter Localizations
        if: matrix.name == 'TargetResource'
        working-directory: spm/TargetResource/App
        run: |
          bazel build //Packages/TargetResource:TargetResourceTests --config=lang.en
          bundle=$(find -L bazel-bin/Packages/TargetResource -name TargetResourceTests.zip | head -1)
          unzip -Z1 "$bundle" | grep -q "en.lproj"
          unzip -Z1 "$bundle" | grep -q "Base.lproj"
          ! unzip -Z1 "$bundle" | grep -q "ja.lproj"
          ! unzip -Z1 "$bundle" | grep -q "de.lproj"

      # The subprocess runtime needs macOS 13 while the consumer may target 12.
      # Building only the host isolates this from the fixture plugin's own APIs.
      - name: Build Plugin Host For Older Consumer
        if: matrix.name == 'PrebuildPlugin'
        working-directory: spm/PrebuildPlugin/App
        run: bazel build //:_plugin_host --macos_minimum_os=12.0

      # A command plugin is not run by a build: it is a verb someone types, and
      # running it is the only proof it is there. The fixture also has an
      # executable product named `hello`, so the command target is disambiguated
      # as `hello_command`.
      - name: Run Command Plugin
        if: matrix.name == 'CommandPlugin'
        working-directory: spm/CommandPlugin/App
        run: |
          bazel run //Packages/CommandPlugin:hello_command -- alpha --beta > command.log
          grep -q "Hello from CommandPlugin" command.log
          grep -q "Arguments: alpha --beta" command.log

      # `bazel test` treats an empty wildcard as an error. Executable-only and
      # library-only fixtures still build above; ask Bazel whether there is
      # anything for this step to run instead of inventing a no-op test.
      - name: Test Package
        working-directory: spm/${{ matrix.name }}/App
        run: |
          tests=$(bazel query 'tests(//...)')
          if [ -n "$tests" ]; then
            bazel test //...
          else
            echo "no Bazel tests, nothing to test"
          fi

      - name: Test Release Configuration
        if: matrix.name == 'ConfigurationCondition'
        working-directory: spm/ConfigurationCondition
        run: |
          swift test -c release
          cd App
          bazel test -c opt //...
          actions=$(bazel aquery -c opt 'mnemonic("SwiftCompile", deps(//Packages/ConfigurationCondition:ConfigurationCondition))')
          printf '%s' "$actions" | grep -q -- '-DRELEASE_ONLY'
          ! printf '%s' "$actions" | grep -q -- '-DDEBUG_ONLY'

      # A test bundle carries its own `minimum_os_version` through the rule's
      # platform transition, so it proves nothing about the floor every other
      # compile gets. Building the library on its own is what reads the default
      # the workspace wrote, and the back-port it compiles is `obsoleted:` above
      # the package's floor.
      - name: Build Package At Its Deployment Floor
        if: matrix.name == 'DeploymentFloor'
        working-directory: spm/DeploymentFloor/App
        run: |
          grep -q 'build --macos_minimum_os=13.0' config.bazelrc
          bazel build //Packages/DeploymentFloor:FloorProbe


      # SwiftPM's macOS resource bundle is wrapped in Contents/Resources while
      # apple_resource_bundle is flat. Compare their logical resource roots,
      # and require every other observed difference to stay in the documented
      # baseline.
      - name: Compare Resource Bundles
        if: matrix.name == 'TargetResource'
        run: |
          (cd spm/TargetResource/App &&
            bazel build //Packages/TargetResource:TargetResourceTests)
          output=$(cd spm/TargetResource/App &&
            bazel cquery //Packages/TargetResource:TargetResourceTests --output=files |
            grep 'TargetResourceTests.zip$')
          execution_root=$(cd spm/TargetResource/App && bazel info execution_root)
          archive="$execution_root/$output"
          generated="$RUNNER_TEMP/target-resource-bundles"
          unzip -q "$archive" -d "$generated"

          for name in \
            TargetResource_TargetResource.bundle \
            TargetResource_TargetResourceTests.bundle
          do
            reference=$(find -L spm/TargetResource/.build \
              -type d -name "$name" -not -path '*.xctest/*' -print -quit)
            .github/scripts/compare-bundles.py \
              --reference "$reference" \
              --generated "$generated/TargetResourceTests.xctest/Contents/Resources/$name" \
              --swiftpm-resource \
              --baseline .github/scripts/bundle-differences.json
          done

      # One generated library is compiled through two platform configurations:
      # each gets its own settings and only iOS gets the conditional target.
      # Optimized iOS keeps the platform condition but drops the debug half of
      # a combined condition.
      - name: Test Platform Conditions
        if: matrix.name == 'Platform'
        working-directory: spm/Platform/App
        run: |
          bazel build //Packages/Platform:Platform --platforms=@apple_support//platforms:ios_sim_arm64

          mac=$(bazel aquery 'mnemonic("SwiftCompile", deps(//Packages/Platform:Platform))')
          ios=$(bazel aquery --platforms=@apple_support//platforms:ios_sim_arm64 \
            'mnemonic("SwiftCompile", deps(//Packages/Platform:Platform))')
          ios_opt=$(bazel aquery -c opt --platforms=@apple_support//platforms:ios_sim_arm64 \
            'mnemonic("SwiftCompile", deps(//Packages/Platform:Platform))')

          printf '%s' "$mac" | grep -q -- '-DMACOS_PLATFORM'
          ! printf '%s' "$mac" | grep -q -- '-DIOS_PLATFORM'
          ! printf '%s' "$mac" | grep -q 'Sources/IOSOnly/IOSOnly.swift'

          printf '%s' "$ios" | grep -q -- '-DIOS_PLATFORM'
          printf '%s' "$ios" | grep -q -- '-DIOS_DEBUG'
          ! printf '%s' "$ios" | grep -q -- '-DMACOS_PLATFORM'
          printf '%s' "$ios" | grep -q 'Sources/IOSOnly/IOSOnly.swift'

          printf '%s' "$ios_opt" | grep -q -- '-DIOS_PLATFORM'
          ! printf '%s' "$ios_opt" | grep -q -- '-DIOS_DEBUG'

      # A program is not a test: the rules that build one carry `manual`, so
      # `//...` never builds it. Running it is what says it links and works.
      - name: Run Package Programs
        if: matrix.programs
        working-directory: spm/${{ matrix.name }}/App
        env:
          PROGRAMS: ${{ matrix.programs }}
        run: |
          while read -r program; do
            [ -n "$program" ] || continue
            bazel run $program
          done <<< "$PROGRAMS"

      # Both ways round, and not only that both pass: a trait is a compilation
      # condition named after itself, so the flag reaching swiftc is the thing
      # to see.
      - name: Test Package With Trait
        if: matrix.config
        working-directory: spm/${{ matrix.name }}/App
        run: |
          bazel test //... --config=${{ matrix.config }}
          trait="${{ matrix.config }}"
          ! bazel aquery 'mnemonic("SwiftCompile", //...)' | grep -q -- "-D${trait#*.}"
          bazel aquery --config=${{ matrix.config }} 'mnemonic("SwiftCompile", //...)' | grep -q -- "-D${trait#*.}"

      # Select each declared trait on its own, through the `--config` the
      # workspace generated for it. That is what `swift test --traits <trait>`
      # does: the selection replaces the package's defaults, and carries
      # whatever that trait enables.
      - name: Test Each Package Trait
        if: matrix.traits
        working-directory: spm/${{ matrix.name }}/App
        env:
          PACKAGE: ${{ matrix.name }}
          TRAITS: ${{ matrix.traits }}
        run: |
          IFS=',' read -ra traits <<< "$TRAITS"
          for trait in "${traits[@]}"; do
            bazel test //... "--config=${PACKAGE}.${trait}"
          done

      # What each selection resolves to, exactly: the closure of the trait
      # asked for, and nothing of the defaults it replaced. The three SwiftPM
      # names rather than lists — `--disable-default-traits`,
      # `--enable-all-traits`, `--traits default` — answer the same here.
      - name: Probe Trait Selections
        if: matrix.name == 'TraitGraph'
        working-directory: spm/TraitGraph/App
        run: |
          bazel run //Packages/TraitGraph:TraitProbe -- Leaf Middle Top
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.Middle -- Leaf Middle
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.Alternative -- Alternative
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.none
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.all -- Alternative Leaf Middle Top
          bazel run //Packages/TraitGraph:TraitProbe --config=TraitGraph.default -- Leaf Middle Top

  # A mixed Swift/C target needs a SwiftPM that builds one, which is newer than
  # the Xcode every other lane uses, so it has a lane of its own rather than a
  # place in the matrix above: the older toolchains never read its manifest.
  # SwiftPM finds the snapshot through PATH. Bazel gets it through TOOLCHAINS in
  # `user.bazelrc`: repository rules keep Xcode's bundled compiler, which SDK
  # discovery needs, while the actions compile with the snapshot. Both sides
  # must see the same single `Unified` module.
  MixedLanguage:
    name: MixedLanguage (Swift 6.5 snapshot)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    needs: [artifact]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Install Swift 6.5 snapshot
        run: .github/scripts/install-swift-snapshot.sh

      - name: Bazel Cache
        uses: ./.github/actions/bazel-cache
        with:
          group: package-MixedLanguage

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: SwiftPM Build And Test
        working-directory: spm/MixedLanguage
        run: |
          swift build
          swift test
          swift run unified-consumer | grep -qx 'unified ok'

      - name: Bazel Generation
        run: |
          set -o pipefail
          chmod +x bazelize
          ./bazelize --input spm/MixedLanguage --output spm/MixedLanguage/App | tee bazelize.log
          [ ! -s bazelize.log ]

      - name: Select Swift 6.5 For Bazel
        working-directory: spm/MixedLanguage/App
        run: |
          {
            echo "build --repo_env=TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault"
            echo "build --action_env=TOOLCHAINS=$TOOLCHAINS"
          } > user.bazelrc

      - name: Check Generated Starlark
        working-directory: spm/MixedLanguage/App
        run: bash "$GITHUB_WORKSPACE/.github/scripts/check-generated-starlark.sh"

      - name: Test And Run With Bazel
        working-directory: spm/MixedLanguage/App
        run: |
          bazel test //...
          bazel run //Packages/MixedLanguage:unified-consumer | grep -qx 'unified ok'

      - name: Verify One Public Module
        working-directory: spm/MixedLanguage/App
        run: |
          modules=$(bazel cquery //Packages/MixedLanguage:Unified --output=starlark \
            --starlark:expr='[(m.name, bool(m.swift), bool(m.clang)) for key, info in providers(target).items() if key.endswith("%SwiftInfo") for m in info.direct_modules]')
          echo "$modules"
          [ "$modules" = '[("Unified", True, True)]' ]

  # Host tests and SwiftPM controls remain in IntegratePackage (Platform).
  # Each additional SDK has its own step and its own result; compile-only
  # variants never claim execution on a physical device or a hosted visionOS
  # Simulator.
  #
  # Every variant reads one generated workspace, and the first Bazel command on
  # a fresh runner spends minutes setting it up while later ones, under any
  # configuration, take seconds. So the variants share a job per runner they
  # need instead of each paying that start. Each step runs after an earlier
  # variant failed, and any failure fails the job.
  #
  # Each job keeps the cache group one of its variants already saved under, so
  # mainline's outputs keep serving it.
  PlatformSimulators:
    name: Platform (simulator tests)
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    needs: [artifact]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Bazel Cache
        uses: ./.github/actions/bazel-cache
        with:
          group: Platform-ios_sim_arm64

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Generate Platform Workspace
        id: generate
        run: |
          chmod +x bazelize
          ./bazelize --input spm/Platform --output spm/Platform/App

      - name: Test tvOS Simulator
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel test \
            --local_test_jobs=1 \
            --test_timeout=900 \
            --test_output=errors \
            --platforms=@apple_support//platforms:tvos_sim_arm64 \
            //Packages/Platform:PlatformTests_tvos_simulator

      - name: Test watchOS Simulator
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel test \
            --local_test_jobs=1 \
            --test_timeout=900 \
            --test_output=errors \
            --platforms=@apple_support//platforms:watchos_arm64 \
            //Packages/Platform:PlatformTests_watchos_simulator

      - name: Boot iOS Simulator
        id: boot
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        run: .github/scripts/boot-apple-simulator.sh

      - name: Test iOS Simulator
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel test \
            "--@build_bazel_rules_apple//apple/build_settings:ios_simulator_device=$SIMULATOR_DEVICE" \
            --local_test_jobs=1 \
            --test_timeout=900 \
            --test_output=errors \
            --platforms=@apple_support//platforms:ios_sim_arm64 \
            //Packages/Platform:PlatformTests_ios_simulator

  PlatformBuilds:
    name: Platform (compile-only builds)
    runs-on: macos-26-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    needs: [artifact]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Bazel Cache
        uses: ./.github/actions/bazel-cache
        with:
          group: Platform-visionos_sim_arm64

      - name: Download Bazelize
        uses: actions/download-artifact@v8
        with:
          name: bazelize

      - name: Generate Platform Workspace
        id: generate
        run: |
          chmod +x bazelize
          ./bazelize --input spm/Platform --output spm/Platform/App

      - name: Build visionOS Simulator
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel build \
            --platforms=@apple_support//platforms:visionos_sim_arm64 \
            //Packages/Platform:PlatformTests_xros_simulator

      - name: Build iOS Device
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel build \
            --platforms=@apple_support//platforms:ios_arm64 \
            //Packages/Platform:PlatformTests_ios_device_bundle

      - name: Build tvOS Device
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel build \
            --platforms=@apple_support//platforms:tvos_arm64 \
            //Packages/Platform:PlatformTests_tvos_device_bundle

      - name: Build watchOS Device
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel build \
            --platforms=@apple_support//platforms:watchos_device_arm64 \
            //Packages/Platform:PlatformTests_watchos_device_bundle

      - name: Build visionOS Device
        if: ${{ !cancelled() && steps.generate.outcome == 'success' }}
        working-directory: spm/Platform/App
        run: |
          bazel build \
            --platforms=@apple_support//platforms:visionos_arm64 \
            //Packages/Platform:PlatformTests_xros_device_bundle
